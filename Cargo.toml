[package]
name = "rusty_ratchet"
version = "0.1.0"
edition = "2024"

[dependencies]
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "reusable_secrets", "getrandom"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
hmac = "0.13.0"
uniffi = { version = "0.32.0", features = ["cli"] }

[lib]
name="rusty_ratchet"
crate-type = ["cdylib"]

[build-dependencies]
uniffi = { version = "0.32.0", features = [ "build" ] }