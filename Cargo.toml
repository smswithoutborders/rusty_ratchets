[package]
name = "rusty_ratchet"
version = "0.1.0"
edition = "2024"

[dependencies]
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "reusable_secrets", "getrandom"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
hmac = "0.13.0"
chacha20poly1305 = "0.11.0-rc.3"
thiserror = "2.0.20"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }

[lib]
name="rusty_ratchet"
crate-type = ["cdylib"]

[build-dependencies]